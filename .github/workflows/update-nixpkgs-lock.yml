---
name: Update nixpkgs lock

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update nixpkgs-lock
        run: nix flake update nixpkgs-lock

      - name: Open pull request when the locked revision changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old_rev="$(git show HEAD:flake.lock | jq -r '.nodes["nixpkgs-lock"].locked.rev')"
          new_rev="$(jq -r '.nodes["nixpkgs-lock"].locked.rev' flake.lock)"
          if [ "$old_rev" = "$new_rev" ]; then
            echo 'nixpkgs-lock revision unchanged'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch=bot/update-nixpkgs-lock
          git add flake.lock
          git commit -m 'chore: update nixpkgs-lock'
          git push --force origin "HEAD:refs/heads/${branch}"
          existing_prs="$(gh pr list --base main --head "$branch" --state open \
            --json number,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false) | .number')"
          if [ -n "$existing_prs" ]; then
            echo "a nixpkgs-lock PR is already open on ${branch}; it now carries this update"
          else
            gh pr create --base main --head "$branch" \
              --title 'chore: update nixpkgs-lock' \
              --body 'Automated: update nixpkgs-lock and its pinned nixpkgs revision.'
          fi
