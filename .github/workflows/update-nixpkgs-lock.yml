---
name: Update nixpkgs lock

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update nixpkgs-lock
        run: nix flake update nixpkgs-lock

      - name: Open pull request when the locked revision changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- flake.lock; then
            echo 'nixpkgs-lock is already up to date'
            exit 0
          fi

          branch=bot/update-nixpkgs-lock
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flake.lock
          git commit -m 'chore: update nixpkgs-lock'
          git push --force origin "HEAD:refs/heads/${branch}"
          gh pr create --base main --head "$branch" \
            --title 'chore: update nixpkgs-lock' \
            --body 'Automated: update the ecosystem-wide nixpkgs lock.' ||\
            echo "a nixpkgs-lock PR is already open on ${branch}; it now carries this update"
