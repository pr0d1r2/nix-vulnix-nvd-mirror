---
name: Mirror NVD feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

concurrency:
  group: mirror-deploy
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Lint shell scripts
        run: shellcheck download.sh health_check.sh

      - name: Download NVD feeds
        id: download
        run: bash download.sh
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Notify on download failure
        if: failure() && steps.download.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            curl -fsSL --max-time 30 -X POST \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"NVD mirror download failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL" || true
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true

      - name: Health-check deployed Pages
        run: bash health_check.sh
        env:
          PAGES_URL: https://pr0d1r2.github.io/nix-vulnix-nvd-mirror
